openapi: 3.1.0
info:
  title: Prof. Warlock API
  description: |
    API for generating natal charts and stats with MongoDB storage.
    
    Features:
    - Natal chart generation with S3 storage
    - Daily transit calculations with caching
    - Premium features (location and relocation charts)
    - Image generation with ETag caching
    - Birth data validation and security
    - Multi-language privacy policy
    
    Premium Features:
    - Location-based synastry charts
    - Relocation charts with transits
    - Advanced transit calculations
    
    Caching:
    - Daily stats cached for 2 days
    - ETag-based image caching
    - Optimized performance with TTL indexes
  version: 1.0.0
paths:
  /:
    get:
      summary: Health check endpoint
      operationId: healthCheck
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: string
                  version:
                    type: string

  


  /natal-chart:
    post:
      summary: Create a natal chart record in the database
      operationId: createNatalChartRecord
      security:
        - ApiKeyAuth: []
      parameters:
        - name: purchased
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Premium access status (true/false)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NatalChartRequest'
      responses:
        '200':
          description: Natal chart record created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NatalChartCreateResponse'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /natal-chart-image/{mongo_id}:
    post:
      summary: Get natal chart image by ID (from S3 cache or generate new)
      operationId: getNatalChartImage
      security:
        - ApiKeyAuth: []
      parameters:
        - name: mongo_id
          in: path
          required: true
          schema:
            type: string
          description: MongoDB document ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NatalTransitRequest'
      responses:
        '200':
          description: Natal chart image retrieved or generated successfully
          headers:
            X-Mongo-ID:
              description: MongoDB document ID
              schema:
                type: string
            X-S3-URL:
              description: S3 URL for the chart image
              schema:
                type: string
            X-QR-URL:
              description: QR code URL
              schema:
                type: string
            X-Source:
              description: Image source (s3-cache or generated)
              schema:
                type: string
                enum: [s3-cache, generated]
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid MongoDB ID format
        '401':
          description: Unauthorized
        '403':
          description: Birth information doesn't match
        '500':
          description: Internal server error

  /natal-chart/{mongo_id}:
    get:
      summary: Retrieve natal chart data by MongoDB ID
      operationId: getNatalChartById
      security:
        - ApiKeyAuth: []
      parameters:
        - name: mongo_id
          in: path
          required: true
          schema:
            type: string
          description: MongoDB document ID
        - name: birth_date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{2}-\d{2}-\d{4}$'
          description: Birth date in DD-MM-YYYY format
        - name: birth_time
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{2}:\d{2}$'
          description: Birth time in HH:MM format
      responses:
        '200':
          description: Natal chart data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NatalChartResponse'
        '400':
          description: Invalid MongoDB ID format or birth date format
        '401':
          description: Unauthorized
        '404':
          description: Natal chart not found or birth information doesn't match
        '500':
          description: Internal server error

  /natal-stats:
    post:
      summary: Get natal stats including sun sign, moon sign, rising sign and transit information
      operationId: getNatalStats
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NatalStatsRequest'
      responses:
        '200':
          description: Natal stats retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      full_report:
                        type: string
                      sun_sign:
                        type: string
                      moon_sign:
                        type: string
                      rising_sign:
                        type: string
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  /natal-transit/{mongo_id}:
    post:
      summary: Get natal transit data (classic, free endpoint)
      operationId: getNatalTransit
      security:
        - ApiKeyAuth: []
      parameters:
        - name: mongo_id
          in: path
          required: true
          schema:
            type: string
          description: MongoDB document ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NatalTransitRequest'
      responses:
        '200':
          description: Classic transit data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitResponse'
        '400':
          description: Invalid MongoDB ID format
        '401':
          description: Unauthorized
        '403':
          description: Birth information doesn't match
        '500':
          description: Internal server error

  /natal-transit-location/{mongo_id}:
    post:
      summary: Get natal transit location data (premium endpoint)
      description: |
        Calculate transit data for current location. 
        
        **Timezone Handling:**
        - today_time must be UTC-0 (no timezone conversion needed)
        - Birth chart uses original birth location and timezone
        - Transits are calculated for the current location
      operationId: getNatalTransitLocation
      security:
        - ApiKeyAuth: []
      parameters:
        - name: mongo_id
          in: path
          required: true
          schema:
            type: string
          description: MongoDB document ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NatalTransitLocationRequest'
      responses:
        '200':
          description: Location-based transit data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitResponse'
        '400':
          description: Invalid MongoDB ID format
        '401':
          description: Unauthorized
        '402':
          description: Payment Required - Premium access required
        '403':
          description: Birth information doesn't match
        '500':
          description: Internal server error

  /natal-transit-relocation/{mongo_id}:
    post:
      summary: Get natal transit relocation data (premium endpoint)
      description: |
        Calculate transit data for relocation chart.
        
        **Timezone Handling:**
        - Timezone is REQUIRED for relocation charts
        - Transit times are always calculated in UTC-0
        - Birth chart is calculated as if born at relocation location with relocation timezone
        - Transits are calculated for the relocation location
      operationId: getNatalTransitRelocation
      security:
        - ApiKeyAuth: []
      parameters:
        - name: mongo_id
          in: path
          required: true
          schema:
            type: string
          description: MongoDB document ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NatalTransitRelocationRequest'
      responses:
        '200':
          description: Relocation-based transit data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitResponse'
        '400':
          description: Invalid MongoDB ID format
        '401':
          description: Unauthorized
        '402':
          description: Payment Required - Premium access required
        '403':
          description: Birth information doesn't match
        '500':
          description: Internal server error

  /natal-daily-image/{mongo_id}:
    get:
      summary: Generate daily natal chart image from natal_daily collection record
      operationId: getNatalDailyImage
      security:
        - ApiKeyAuth: []
      parameters:
        - name: mongo_id
          in: path
          required: true
          schema:
            type: string
          description: MongoDB natal_daily document ID
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag header for cache validation
      responses:
        '200':
          description: Daily natal chart image generated successfully
          headers:
            ETag:
              description: ETag for caching
              schema:
                type: string
            Cache-Control:
              description: Cache control directive
              schema:
                type: string
            X-Chart-Type:
              description: Chart type used
              schema:
                type: string
            X-Mongo-ID:
              description: MongoDB natal_daily document ID
              schema:
                type: string
            X-Natal-ID:
              description: MongoDB natal document ID
              schema:
                type: string
            X-Transit-Date:
              description: Transit date used for calculation
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        '304':
          description: Not Modified - Use cached version
          headers:
            ETag:
              description: ETag for caching
              schema:
                type: string
            Cache-Control:
              description: Cache control directive
              schema:
                type: string
        '400':
          description: Invalid MongoDB ID format
        '401':
          description: Unauthorized
        '404':
          description: Daily natal chart record not found
        '500':
          description: Internal server error



  /privacy:
    get:
      summary: Privacy policy endpoint with language support
      operationId: getPrivacyPolicy
      parameters:
        - name: lang
          in: query
          required: false
          schema:
            type: string
            enum: [en, tr]
            default: en
          description: Language code for privacy policy (en=English, tr=Turkish)
      responses:
        '200':
          description: Privacy policy information in requested language
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid language parameter

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: API Key for authentication

  schemas:
    NatalChartRequest:
      type: object
      properties:
        first_name:
          type: string
          description: First name of the person
        last_name:
          type: string
          description: Last name of the person
        birth_day:
          type: integer
          minimum: 1
          maximum: 31
          description: Birth day (1-31)
        birth_month:
          type: integer
          minimum: 1
          maximum: 12
          description: Birth month (1-12)
        birth_year:
          type: integer
          minimum: 1900
          maximum: 2100
          description: Birth year
        birth_time:
          type: string
          format: time
          pattern: '^\d{2}:\d{2}$'
          description: Birth time in HH:MM format
        birth_place:
          type: string
          description: Birth place (city, country)
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude coordinate
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude coordinate
        timezone:
          type: string
          pattern: '^[+-]\d{1,2}:\d{2}$'
          description: Timezone offset in +/-HH:MM format (e.g., +03:00, -05:00)
        lang:
          type: string
          enum: [en, tr]
          default: en
          description: Language code for the natal chart (en=English, tr=Turkish)
      required:
        - first_name
        - last_name
        - birth_day
        - birth_month
        - birth_year
        - birth_time

    NatalStatsRequest:
      type: object
      properties:
        birth_day:
          type: integer
          minimum: 1
          maximum: 31
          description: Birth day (1-31)
        birth_month:
          type: integer
          minimum: 1
          maximum: 12
          description: Birth month (1-12)
        birth_year:
          type: integer
          minimum: 1900
          maximum: 2100
          description: Birth year
        birth_time:
          type: string
          format: time
          pattern: '^\d{2}:\d{2}$'
          description: Birth time in HH:MM format
        birth_place:
          type: string
          description: Birth place (city, country)
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude coordinate
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude coordinate
        timezone:
          type: string
          pattern: '^[+-]\d{1,2}:\d{2}$'
          description: Timezone offset in +/-HH:MM format (e.g., +03:00, -05:00)
        today_day:
          type: integer
          minimum: 1
          maximum: 31
          description: Today's day (1-31), optional
        today_month:
          type: integer
          minimum: 1
          maximum: 12
          description: Today's month (1-12), optional
        today_year:
          type: integer
          minimum: 1900
          maximum: 2100
          description: Today's year, optional
        today_time:
          type: string
          format: time
          pattern: '^\d{2}:\d{2}$'
          description: Today's time in HH:MM format, optional
      required:
        - birth_day
        - birth_month
        - birth_year
        - birth_time



    NatalChartResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, error]
          description: Response status
        data:
          type: object
          properties:
            id:
              type: string
              description: MongoDB document ID
            user_info:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                birth_day:
                  type: integer
                birth_month:
                  type: integer
                birth_year:
                  type: integer
                birth_time:
                  type: string
                birth_place:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
                timezone:
                  type: string
                  description: Timezone offset in +/-HH:MM format
                lang:
                  type: string
                  description: Language code (en=English, tr=Turkish)
                purchased:
                  type: boolean
                  description: Premium access status for location and relocation features
            chart_info:
              type: object
              properties:
                s3_url:
                  type: string
                  description: S3 URL for the chart image
                qr_url:
                  type: string
                  description: QR code URL
                file_size:
                  type: integer
                  description: File size in bytes
                status:
                  type: string
                  enum: [generating, completed, failed]
                  description: Chart generation status
            stats:
              type: object
              description: Daily natal stats generated on-demand with transit information for today (cached for performance)
              properties:
                full_report:
                  type: string
                  description: Full natal chart report in markdown with current transits
                sun_sign:
                  type: string
                  description: Sun sign
                moon_sign:
                  type: string
                  description: Moon sign
                rising_sign:
                  type: string
                  description: Rising/Ascendant sign
            metadata:
              type: object
              properties:
                created_at:
                  type: string
                  format: date-time
                  description: Creation timestamp
                updated_at:
                  type: string
                  format: date-time
                  description: Last update timestamp

    NatalChartCreateResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, error]
          description: Response status
        data:
          type: object
          properties:
            id:
              type: string
              description: MongoDB document ID
            purchased:
              type: boolean
              description: Premium access status
            qr_url:
              type: string
              description: QR code URL for the chart
            user_info:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                birth_day:
                  type: integer
                birth_month:
                  type: integer
                birth_year:
                  type: integer
                birth_time:
                  type: string
                birth_place:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
                timezone:
                  type: string
                lang:
                  type: string
            created_at:
              type: string
              format: date-time
              description: Creation timestamp

    NatalTransitRequest:
      type: object
      properties:
        birth_day:
          type: integer
          minimum: 1
          maximum: 31
          description: Birth day (1-31)
        birth_month:
          type: integer
          minimum: 1
          maximum: 12
          description: Birth month (1-12)
        birth_year:
          type: integer
          minimum: 1900
          maximum: 2100
          description: Birth year
        birth_time:
          type: string
          format: time
          pattern: '^\d{2}:\d{2}$'
          description: Birth time in HH:MM format
        today_day:
          type: integer
          minimum: 1
          maximum: 31
          description: Today's day (1-31), optional
        today_month:
          type: integer
          minimum: 1
          maximum: 12
          description: Today's month (1-12), optional
        today_year:
          type: integer
          minimum: 1900
          maximum: 2100
          description: Today's year, optional
        today_time:
          type: string
          format: time
          pattern: '^\d{2}:\d{2}$'
          description: Today's time in HH:MM format, optional
      required:
        - birth_day
        - birth_month
        - birth_year
        - birth_time

    NatalTransitLocationRequest:
      type: object
      properties:
        birth_day:
          type: integer
          minimum: 1
          maximum: 31
          description: Birth day (1-31)
        birth_month:
          type: integer
          minimum: 1
          maximum: 12
          description: Birth month (1-12)
        birth_year:
          type: integer
          minimum: 1900
          maximum: 2100
          description: Birth year
        birth_time:
          type: string
          format: time
          pattern: '^\d{2}:\d{2}$'
          description: Birth time in HH:MM format
        current_location:
          type: string
          description: Current location name (optional)
        current_latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Current latitude coordinate (optional)
        current_longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Current longitude coordinate (optional)
        today_day:
          type: integer
          minimum: 1
          maximum: 31
          description: Today's day (1-31), optional
        today_month:
          type: integer
          minimum: 1
          maximum: 12
          description: Today's month (1-12), optional
        today_year:
          type: integer
          minimum: 1900
          maximum: 2100
          description: Today's year, optional
        today_time:
          type: string
          format: time
          pattern: '^\d{2}:\d{2}$'
          description: Today's time in HH:MM format (must be UTC-0), optional
      required:
        - birth_day
        - birth_month
        - birth_year
        - birth_time
      example:
         birth_day: 1
         birth_month: 1
         birth_year: 1990
         birth_time: "12:00"
         today_day: 4
         today_month: 1
         today_year: 2024
         today_time: "15:30"

    NatalTransitRelocationRequest:
      type: object
      properties:
        birth_day:
          type: integer
          minimum: 1
          maximum: 31
          description: Birth day (1-31)
        birth_month:
          type: integer
          minimum: 1
          maximum: 12
          description: Birth month (1-12)
        birth_year:
          type: integer
          minimum: 1900
          maximum: 2100
          description: Birth year
        birth_time:
          type: string
          format: time
          pattern: '^\d{2}:\d{2}$'
          description: Birth time in HH:MM format
        relocation_location:
          type: string
          description: Relocation location name (optional)
        relocation_latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Relocation latitude coordinate (optional)
        relocation_longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Relocation longitude coordinate (optional)
        timezone:
          type: string
          pattern: '^[+-]\d{1,2}:\d{2}$'
          description: Timezone offset for relocation location in +/-HH:MM format (e.g., +03:00, -05:00). REQUIRED for relocation charts.
        today_day:
          type: integer
          minimum: 1
          maximum: 31
          description: Today's day (1-31), optional
        today_month:
          type: integer
          minimum: 1
          maximum: 12
          description: Today's month (1-12), optional
        today_year:
          type: integer
          minimum: 1900
          maximum: 2100
          description: Today's year, optional
        today_time:
          type: string
          format: time
          pattern: '^\d{2}:\d{2}$'
          description: Today's time in HH:MM format (will be converted to UTC-0), optional
      required:
        - birth_day
        - birth_month
        - birth_year
        - birth_time
        - timezone
      example:
         birth_day: 1
         birth_month: 1
         birth_year: 1990
         birth_time: "12:00"
         timezone: "+00:00"
         today_day: 4
         today_month: 1
         today_year: 2024
         today_time: "15:30"



    TransitResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, error]
          description: Response status
        data:
          type: object
          properties:
            chart_type:
              type: string
              enum: [classic, location, relocation]
              description: Chart type used
            mongo_id:
              type: string
              description: MongoDB document ID
            transit_date:
              type: string
              format: date
              description: Transit date used for calculation
            transit_time:
              type: string
              format: time
              description: Transit time used for calculation
            daily_record_id:
              type: string
              description: MongoDB natal_daily document ID for chart image generation
            current_location:
              type: string
              description: Current location used (only for location chart type)
            current_coordinates:
              type: object
              description: Current coordinates (only for location chart type)
              properties:
                latitude:
                  type: number
                  description: Current latitude
                longitude:
                  type: number
                  description: Current longitude
            relocation_location:
              type: string
              description: Relocation location used (only for relocation chart type)
            relocation_coordinates:
              type: object
              description: Relocation coordinates (only for relocation chart type)
              properties:
                latitude:
                  type: number
                  description: Relocation latitude
                longitude:
                  type: number
                  description: Relocation longitude
            chart_data:
              type: object
              description: Transit chart data with natal chart + current transits
              properties:
                full_report:
                  type: string
                  description: Full transit report
                sun_sign:
                  type: string
                  description: Sun sign
                moon_sign:
                  type: string
                  description: Moon sign
                rising_sign:
                  type: string
                  description: Rising/Ascendant sign

 